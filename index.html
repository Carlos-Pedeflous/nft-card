<html lang="en">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | NFT preview card component</title>

<body>

  <article id="info-card">

    <div>
      <a href="asdsad" target="_blank"><img class="NFT" src="/images/image-equilibrium.jpg" alt="NFT"></a>

      <img class="view-icon" src="/images/icon-view.svg">
      
    </div>
     
    <h2><a href="lasdñlasdk" target="_blank">Equilibrium #3429</a></h2>

    <p>Our Equilibrium collection promotes balance and calm.</p>

    <div id="ethereum-time">
      
      <div id="ethereum">
        <img src="/images/icon-ethereum.svg">

      </div>
      
      <div id="time">

        <p>3 days left</p>

    </div>

    <div id="author">

      <img src="/images/image-avatar.png" class="profile-pic" alt="user-pic">

      <p>Creation of<a href="asdasd" target="_blank"> Jules Wyvern</a></p>
